name: Check VOX seat availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      limited_probe:
        description: Check only two Odyssey IMAX showtimes
        required: true
        type: boolean
        default: true
      dry_run:
        description: Print Telegram messages without sending them
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vox-seat-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Google Chrome and display dependencies
        run: npx playwright install --with-deps chrome

      - name: Scan VOX and notify Telegram
        env:
          BROWSER_CHANNEL: chrome
          HEADLESS: "0"
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          CHECK_TARGET: ${{ inputs.limited_probe && 'the-odyssey-imax' || '' }}
          CHECK_LIMIT: ${{ inputs.limited_probe && '2' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a npm run check
